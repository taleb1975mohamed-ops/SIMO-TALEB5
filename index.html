<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة القيمين الدينيين - منظومة تدبير المساجد والأئمة</title>
    <meta name="description" content="منظومة متكاملة لتدبير وتسيير شؤون القيمين الدينيين بالمساجد (الأئمة، الخطباء، المؤذنين، المنظفين، قراء الحزب) والتعويضات والبطائق الإدارية" />
    <meta property="og:title" content="إدارة القيمين الدينيين - منظومة تدبير المساجد والأئمة" />
    <meta property="og:description" content="منظومة متكاملة لتدبير وتسيير شؤون القيمين الدينيين بالمساجد (الأئمة، الخطباء، المؤذنين، المنظفين، قراء الحزب) والتعويضات والبطائق الإدارية" />
    
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <!-- Google Fonts: Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #2c3e50; 
            --secondary: #27ae60; 
            --bg: #e0e5ec;
            --shadow: 9px 9px 16px rgba(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.5);
            --inner-shadow: inset 6px 6px 12px #b8b9be, inset -6px -6px 12px #ffffff;
        }

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-feature-settings: "locl" 0;
            -webkit-font-feature-settings: "locl" 0;
        }

        body { 
            background-color: var(--bg); 
            margin: 0; 
            padding: 0; 
            color: #444; 
            min-height: 100vh;
        }

        .en-input, .tabular-nums, input[type="date"], input[type="number"], input[type="tel"] {
            direction: ltr !important;
            text-align: right !important;
            font-variant-numeric: lining-nums tabular-nums !important;
            font-family: Arial, Roboto, 'Tajawal', sans-serif !important;
        }

        input[type="date"]::-webkit-datetime-edit {
            direction: ltr !important;
        }

        @media print {
            body {
                background: white !important;
                padding: 0 !important;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
